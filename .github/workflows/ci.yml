name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI 専用のダミー値。本番デプロイでは各環境の秘密として固有値を設定する。
      AUTH_SECRET: ci-placeholder-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (with coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # 既知の Next.js アドバイザリ（Next 16 への移行が必要）が残るため、
      # 可視化目的で実行し CI はブロックしない。対応方針は SECURITY.md 参照。
      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true
